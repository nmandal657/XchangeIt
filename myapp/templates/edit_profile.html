{% extends 'base.html' %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <form class="form" method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" name="name" id="name" class="form-control" value="{{ user.name|default_if_none:'' }}" required>
                </div>

                <div class="mb-3">
                    <label for="phone_number" class="form-label">Phone Number</label>
                    <input type="text" name="phone_number" id="phone_number" class="form-control" value="{{ user.phone_number|default_if_none:'' }}">
                </div>

                <div class="mb-3">
                    <label for="qtr_no" class="form-label">Quarter / House No.</label>
                    <input type="text" name="qtr_no" id="qtr_no" class="form-control" value="{{ user.qtr_no|default_if_none:'' }}">
                </div>

                <div class="mb-3">
                    <label for="city" class="form-label">City</label>
                    <input type="text" name="city" id="city" class="form-control" value="{{ user.city|default_if_none:'' }}">
                </div>

                <div class="mb-3">
                    <label for="state" class="form-label">State</label>
                    <input type="text" name="state" id="state" class="form-control" value="{{ user.state|default_if_none:'' }}">
                </div>

                <div class="mb-3">
                    <label for="postal_code" class="form-label">Postal Code</label>
                    <input type="text" name="postal_code" id="postal_code" class="form-control" value="{{ user.postal_code|default_if_none:'' }}">
                </div>

                <button type="submit" class="btn w-100" style="background-color:#20c997; color: white;">Submit</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
